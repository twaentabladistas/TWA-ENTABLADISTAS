<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Entabladistas - Tayabas Western Academy</title>
  

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  

  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="beam"></div>
  <div class="pool"></div>


  <div class="drape l"></div>
  <div class="drape r"></div>
  <div class="valance"></div>


  <main>
    <div class="bulbs"></div>


    <div class="logo-badge">
      <img src="logo.jpg" alt="Entabladistas Logo" class="logo-img">
    </div>

  
    <h1 id="name">ENTABLADISTAS</h1>
    <div class="sub-title" id="subtitle">TAYABAS WESTERN ACADEMY</div>
    <p class="tag" id="tag"></p>

  
    <article class="announcement-card" id="announcement">
      <div class="card-badge">
        <span class="badge-dot"></span>
        <span id="badge-text">OFFICIAL ANNOUNCEMENT</span>
      </div>
      
      <small class="category" id="ann-category"></small>
      <h2 class="title" id="ann-title"></h2>
      <p class="description" id="ann-desc"></p>
      
      <div class="meta">
        <span class="date" id="ann-date"></span>
        <a class="action-btn" id="ann-btn" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </article>


    <ul id="links"></ul>


<div class="view-counter">
  <span class="eye-icon">👁️</span>
  <span id="visits-count">...</span>
</div>

    <footer id="foot"></footer>
  </main>

  


  <script src="script.js"></script>

</html>
